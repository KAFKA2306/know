site_name: Know
site_url: https://kafka2306.github.io/know/
repo_url: https://github.com/KAFKA2306/know
repo_name: KAFKA2306/know

site_description: 開発・生活・研究で調べたことを、一次資料と確認時点からたどる。
site_author: KAFKA2306
copyright: Copyright &copy; 2026 KAFKA2306

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/KAFKA2306

validation:
  links:
    absolute_links: warn
    anchors: warn

theme:
  name: material
  language: ja
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow
  icon:
    logo: material/book-open-page-variant-outline
  palette:
    - scheme: default
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替える
    - scheme: slate
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替える
  font:
    text: Noto Sans JP
    code: Roboto Mono

plugins:
  - search:
      lang:
        - en
        - ja
  - tags

extra_css:
  - stylesheets/know.css

markdown_extensions:
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - admonition
  - nl2br
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - ホーム: index.md
  - 研究判断:
      - research/index.md
      - 米国の電力供給: dev/deepdive/us-electricity-supply.md
      - カリフォルニア州の自動運転報告: dev/deepdive/california-av-reporting-2026.md
      - 製造の品質検査: dev/deepdive/manufacturing-quality-inspection.md
      - 再使用ロケット: dev/deepdive/reusable-launch-evidence.md
      - 根拠の記録と検証の導入ガイド: services/evidence-contract-integration.md
  - 開発:
      - dev/index.md
      - AIエージェント: dev/agent/index.md
      - WSL: dev/wsl/index.md
      - 情報処理の実践:
          - dev/deepdive/index.md
          - 基礎:
              - データとは何か: dev/deepdive/foundations/data.md
              - プログラムの構造: dev/deepdive/foundations/structure.md
              - ネットワークとHTTP: dev/deepdive/foundations/network.md
              - データベースとSQL: dev/deepdive/foundations/database.md
          - 実践:
              - Zero-Fat設計論: dev/deepdive/zero-fat.md
              - 型システムと契約: dev/deepdive/typing.md
              - MCPエコシステム: dev/deepdive/mcp.md
              - Taskfile & uv: dev/deepdive/workflow.md
              - デザイントークン: dev/deepdive/design.md
              - AIパイプライン: dev/deepdive/ai-pipeline.md
              - AIペルソナ品質管理: dev/deepdive/persona.md
  - 生活・金融:
      - life/index.md
      - 税金: life/tax/index.md
      - クレジットカード積立: life/money/credit-card-investment-2026.md
  - 公開ツール: bookmarks/Service/Sites/index.md
  - ブックマーク:
      - bookmarks/index.md
      - 開発:
          - bookmarks/Dev/index.md
          - AI: bookmarks/Dev/AI/index.md
          - データ: bookmarks/Dev/Data/index.md
          - 開発ツール: bookmarks/Dev/Tool/index.md
      - ゲーム:
          - bookmarks/Game/index.md
          - VR: bookmarks/Game/VR/index.md
          - ボードゲーム: bookmarks/Game/Board/index.md
          - デジタルゲーム: bookmarks/Game/Digital/index.md
      - 金融:
          - bookmarks/Finance/index.md
          - 銀行: bookmarks/Finance/Bank/index.md
          - 市場: bookmarks/Finance/Market/index.md
          - 暗号資産: bookmarks/Finance/Crypto/index.md
      - サービス:
          - bookmarks/Service/index.md
          - クラウド: bookmarks/Service/Cloud/index.md
          - SNS: bookmarks/Service/Social/index.md
      - メディア:
          - bookmarks/Media/index.md
          - 動画: bookmarks/Media/Video/index.md
          - 音楽: bookmarks/Media/Music/index.md
      - 学術:
          - bookmarks/Academic/index.md
          - 図書館: bookmarks/Academic/Library/index.md
          - 研究資料: bookmarks/Academic/Research/index.md
      - 生活:
