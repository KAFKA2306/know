name: Ontology audit

on:
  workflow_dispatch:
  push:
    paths:
      - ontology/**
      - scripts/audit_project_ontologies.py
      - .github/workflows/ontology-audit.yml
  schedule:
    - cron: "17 21 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema
      - name: Validate registered project ontologies
        run: python scripts/audit_project_ontologies.py
