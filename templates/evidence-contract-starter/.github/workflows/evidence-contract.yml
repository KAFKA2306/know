name: evidence-contract

on:
  pull_request:
    paths:
      - 'evidence-contract/**'
      - '.github/workflows/evidence-contract.yml'
  push:
    branches: [main]
    paths:
      - 'evidence-contract/**'
      - '.github/workflows/evidence-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run validator tests
        run: python -m unittest evidence-contract/test_validator.py
      - name: Validate positive fixture
        run: python evidence-contract/validate_contract.py evidence-contract/examples/valid.json
      - name: Verify missing evidence fails closed
        shell: bash
        run: |
          if python evidence-contract/validate_contract.py evidence-contract/examples/missing-evidence.json; then
            echo 'Expected missing-evidence fixture to fail' >&2
            exit 1
          fi
